<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ========== PART 1: THE "HEAD" ==========
       Settings the phone reads first. Nothing here is visible on screen. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BrainFog</title>

  <!-- The pixel font for titles, and the icon set -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">

  <!-- ========== PART 2: THE "STYLE" (CSS) ==========
       This is how everything LOOKS: colors, sizes, glow, spacing. -->
  <style>
    /* Your color palette. Change a color here and it changes everywhere. */
    :root {
      --bg: #0d0b1e;      /* dark arcade background */
      --pink: #ff3fa4;
      --cyan: #29e7ff;
      --yellow: #ffe14d;
      --text: #e8e6ff;
      --dim: #8f8ab8;     /* faded text for finished things */
      --round: 14px;      /* how round the corners are */
    }

    * { box-sizing: border-box; }

    /* The whole screen: top bar, scrolling middle, bottom bar, stacked */
    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: 'Chakra Petch', sans-serif;
    }

    /* Pixel font, used only for titles so the list stays easy to read */
    .pixel { font-family: 'Press Start 2P', monospace; }

    /* ---- The glow effect ---- */
    .glow-pink   { border: 2px solid var(--pink);   box-shadow: 0 0 6px var(--pink),   0 0 18px rgba(255, 63, 164, 0.45); }
    .glow-cyan   { border: 2px solid var(--cyan);   box-shadow: 0 0 6px var(--cyan),   0 0 18px rgba(41, 231, 255, 0.40); }
    .glow-yellow { border: 2px solid var(--yellow); box-shadow: 0 0 6px var(--yellow), 0 0 18px rgba(255, 225, 77, 0.40); }

    /* ---- Top and bottom bars (they never move) ---- */
    .bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);   /* 5 buttons in a row */
      gap: 4px;
      margin: 10px 12px;
      padding: 6px 4px;
      border-radius: var(--round);
      background: var(--bg);
    }
    .bar.top    { margin-top: max(10px, env(safe-area-inset-top)); }
    .bar.bottom { margin-bottom: max(10px, env(safe-area-inset-bottom)); }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 0;
      background: none;
      border: none;
      border-radius: 10px;
      color: var(--cyan);
      font-size: 10px;
      font-family: inherit;
    }
    .tab i { font-size: 22px; }
    .tab.active { color: var(--yellow); text-shadow: 0 0 8px var(--yellow); }

    /* ---- The middle (the only part that scrolls) ---- */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 20px;
    }

    .day-title {
      color: var(--yellow);
      font-size: 14px;
      margin: 8px 0 6px;
      text-shadow: 0 0 10px var(--yellow);
    }
    .date { color: var(--cyan); font-size: 14px; margin: 0 0 14px; }

    /* The list of things for the day */
    .list {
      border-radius: var(--round);
      padding: 8px 14px;
      margin-bottom: 22px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* The little "pop" when you check something off */
    .item.done .check { animation: pop 0.25s ease-out; }
    @keyframes pop { 50% { transform: scale(1.4); } }

    /* The reverse: a little "shrink" when you uncheck it */
    .item.undo .check { animation: unpop 0.25s ease-out; }
    @keyframes unpop { 50% { transform: scale(0.7); } }

    /* The score counter next to the date */
    .date { display: flex; justify-content: space-between; align-items: center; }
    .score { font-size: 10px; color: var(--pink); text-shadow: 0 0 8px var(--pink); }
    .item + .item { border-top: 1px solid rgba(41, 231, 255, 0.15); }
    .check {
      width: 18px;
      height: 18px;
      flex: none;
      border-radius: 5px;
      border: 2px solid var(--cyan);
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;   /* colors fade instead of jumping */
    }
    .item span { transition: color 0.2s; }
    .item.done .check { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 8px var(--pink); }
    .item.done span   { color: var(--dim); text-decoration: line-through; }

    /* Widgets: a grid of 2 columns; "wide" ones take both columns */
    .widgets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .widget {
      border-radius: var(--round);
      padding: 12px;
      font-size: 14px;
    }
    .widget.wide { grid-column: span 2; }
    .widget .label { font-size: 10px; display: block; margin-bottom: 8px; }
    .widget .from  { font-size: 11px; color: var(--dim); display: block; margin-top: 6px; }

    /* A little progress bar for the project widget */
    .progress { height: 10px; border-radius: 6px; background: rgba(41, 231, 255, 0.15); margin-top: 8px; overflow: hidden; }
    .progress div { height: 100%; width: 40%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  </style>
</head>

<body>
  <!-- ========== PART 3: THE "BODY" (HTML) ==========
       This is WHAT is on the screen, from top to bottom. -->

  <!-- TOP BAR: 5 buttons -->
  <nav class="bar top glow-pink">
    <button class="tab active"><i class="ti ti-home"></i>Home</button>
    <button class="tab"><i class="ti ti-calendar"></i>Calendar</button>
    <button class="tab"><i class="ti ti-book"></i>Journal</button>
    <button class="tab"><i class="ti ti-bell"></i>Reminders</button>
    <button class="tab"><i class="ti ti-notes"></i>Daily log</button>
  </nav>

  <!-- MIDDLE: the part that scrolls -->
  <main>
    <h1 class="day-title pixel">DAY 1-UP</h1>
    <p class="date">
      <span id="today"></span>
      <span id="score" class="score pixel"></span>
    </p>

    <!-- List of things for the day. It starts EMPTY here:
         the script at the bottom fills it in. -->
    <div class="list glow-cyan" id="day-list"></div>

    <!-- Widgets (examples: each will come from its own page later) -->
    <div class="widgets">
      <div class="widget wide glow-pink">
        <span class="label pixel" style="color: var(--pink)">NEXT UP</span>
        Unreal lesson · 18:00
        <span class="from">from Reminders</span>
      </div>
      <div class="widget glow-yellow">
        <span class="label pixel" style="color: var(--yellow)">STREAK</span>
        3 days
        <span class="from">from Trackers</span>
      </div>
      <div class="widget glow-cyan">
        <span class="label pixel" style="color: var(--cyan)">WATER</span>
        4 / 8
        <span class="from">from Trackers</span>
      </div>
      <div class="widget wide glow-cyan">
        <span class="label pixel" style="color: var(--cyan)">QUEST</span>
        Portfolio project
        <div class="progress"><div></div></div>
        <span class="from">from Projects</span>
      </div>
      <div class="widget glow-pink">
        <span class="label pixel" style="color: var(--pink)">WORKOUT</span>
        Legs day
        <span class="from">from Fitness</span>
      </div>
      <div class="widget glow-yellow">
        <span class="label pixel" style="color: var(--yellow)">WATCHING</span>
        Episode 4
        <span class="from">from Binging</span>
      </div>
    </div>
  </main>

  <!-- BOTTOM BAR: 5 buttons -->
  <nav class="bar bottom glow-pink">
    <button class="tab"><i class="ti ti-barbell"></i>Fitness</button>
    <button class="tab"><i class="ti ti-target"></i>Trackers</button>
    <button class="tab"><i class="ti ti-folder"></i>Projects</button>
    <button class="tab"><i class="ti ti-device-tv"></i>Binging</button>
    <button class="tab"><i class="ti ti-dots"></i>More</button>
  </nav>

  <!-- ========== PART 4: THE "SCRIPT" (JavaScript) ==========
       This is what the app DOES: filling in the date, reacting to taps. -->
  <script>
    // STEP 1: Write today's date automatically
    const today = new Date();
    document.getElementById('today').textContent =
      today.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

    // STEP 2: The list for the day.
    // Each task has its text, and "done" is true (checked) or false (not yet).
    const dayList = [
      { text: 'Work 7:30–15:00', done: true },
      { text: 'Laundry', done: false },
      { text: 'Unreal lesson', done: false },
      { text: 'Walk 20 min', done: false }
    ];

    // STEP 3: Update the score, like "CLEAR 1/4"
    function updateScore() {
      const doneCount = dayList.filter(function (task) { return task.done; }).length;
      document.getElementById('score').textContent = 'CLEAR ' + doneCount + '/' + dayList.length;
    }

    // STEP 4: Draw every task on the screen
    function drawList() {
      const box = document.getElementById('day-list');
      box.innerHTML = '';                                   // empty the box first

      dayList.forEach(function (task) {                     // for each task in the list...
        const row = document.createElement('div');          // make a new row
        row.className = task.done ? 'item done' : 'item';   // checked or not?
        row.innerHTML = '<div class="check"></div><span></span>';
        row.querySelector('span').textContent = task.text;  // put the task's words in

        // When you tap the row: flip done/not done, play the right animation, update the score
        row.onclick = function () {
          task.done = !task.done;
          row.classList.toggle('done');
          row.classList.remove('undo');
          if (!task.done) {
            row.classList.add('undo');   // just unchecked? play the "shrink" animation
          }
          updateScore();
        };

        box.appendChild(row);                               // add the row to the screen
      });

      updateScore();
    }

    // STEP 5: Start everything
    drawList();
  </script>
</body>
</html>
